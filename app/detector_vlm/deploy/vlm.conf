[program:detector-vlm]
environment=PROC_NAME="%(program_name)s"
command=/workspace/detector/app/detector_vlm/deploy/vlm.sh
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/portal/detector-vlm.log
redirect_stderr=true
stdout_logfile_maxbytes=50MB
